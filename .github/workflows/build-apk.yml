name: Build Android APK

# Builds the Velto Ops Android app: a Capacitor wrapper around the live PWA
# (https://velto-ops-pwa.vercel.app). The native android/ project is generated
# fresh in CI (so no binaries live in the repo), then compiled on GitHub's
# Ubuntu runners, which ship the Android SDK. The finished APK is uploaded as a
# downloadable artifact.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - claude/chatgpt-supabase-review-9xadpp
    paths:
      - 'apk/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Pillow (icon generation)
        run: pip install --quiet Pillow

      - name: Install JS dependencies
        working-directory: apk
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        working-directory: apk
        run: npx cap add android

      - name: Apply Velto launcher icons
        run: python3 apk/scripts/gen-icons.py

      - name: Capacitor sync
        working-directory: apk
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp apk/android/app/build/outputs/apk/debug/app-debug.apk dist/velto-ops.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: velto-ops-apk
          path: dist/velto-ops.apk
          if-no-files-found: error
          retention-days: 30
